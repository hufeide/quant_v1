<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>量化系统 V1 · 策略竞技场看板</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --ink-3: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --ring: rgba(11,11,11,.10);
    --s1: #2a78d6;
    --s2: #eb6834;
    --s3: #1baf7a;
    --s4: #eda100;
    --pos: #006300;
    --neg: #d03b3b;
    --mid: #f0efec;
    --open-c: #2a78d6;
    --limit-c: #eda100;
    --halt-c: #d03b3b;
    --shadow: 0 1px 2px rgba(11,11,11,.04), 0 0 0 1px var(--ring);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --ink-3: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --ring: rgba(255,255,255,.10);
      --s1: #3987e5;
      --s2: #d95926;
      --s3: #199e70;
      --s4: #c98500;
      --pos: #0ca30c;
      --neg: #e66767;
      --mid: #383835;
      --open-c: #3987e5;
      --limit-c: #c98500;
      --halt-c: #e66767;
      --shadow: 0 0 0 1px var(--ring);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-3: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --ring: rgba(255,255,255,.10);
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
    --pos: #0ca30c;
    --neg: #e66767;
    --mid: #383835;
    --open-c: #3987e5;
    --limit-c: #c98500;
    --halt-c: #e66767;
    --shadow: 0 0 0 1px var(--ring);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 28px 22px 64px; }

  header.top { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  header.top h1 { font-size: 21px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
  header.top p { margin: 4px 0 0; color: var(--ink-2); font-size: 13px; }
  .theme-btn {
    margin-left: auto; flex: none;
    background: var(--surface-1); border: 1px solid var(--ring); color: var(--ink-2);
    border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .theme-btn:hover { color: var(--ink); }

  /* hero */
  .hero {
    display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap;
    padding: 22px 24px; margin-top: 22px;
    background: var(--surface-1); border-radius: 12px; box-shadow: var(--shadow);
  }
  .hero-label { color: var(--ink-2); font-size: 12px; }
  .hero-figure { font-size: 52px; font-weight: 650; letter-spacing: -.03em; line-height: 1; }
  .hero-figure small { font-size: 20px; font-weight: 600; margin-left: 3px; }
  .hero-sub { color: var(--ink-2); font-size: 13px; margin-left: auto; text-align: right; }

  /* filter row: one row, above everything it scopes */
  .filters {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin: 22px 0 16px; padding: 12px 16px;
    background: var(--surface-1); border-radius: 10px; box-shadow: var(--shadow);
  }
  .filters .flabel { font-size: 12px; color: var(--ink-3); margin-right: 2px; }
  .chip {
    border: 1px solid var(--ring); background: transparent; color: var(--ink-2);
    border-radius: 999px; padding: 5px 13px; font: inherit; font-size: 12.5px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip:hover { color: var(--ink); }
  .chip[aria-pressed="true"] {
    background: var(--ink); color: var(--surface-1); border-color: var(--ink); font-weight: 600;
  }
  .chip .sw { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .chip:focus-visible, .tog:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
  .spacer { margin-left: auto; }

  /* kpi tiles */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .tile {
    background: var(--surface-1); border-radius: 12px; box-shadow: var(--shadow);
    padding: 15px 16px; min-width: 0;
  }
  .tile .tlabel { font-size: 12px; color: var(--ink-2); }
  .tile .tval { font-size: 25px; font-weight: 650; margin-top: 3px; letter-spacing: -.02em; }
  .tile .tval small { font-size: 13px; font-weight: 600; }
  .tile .tdelta { font-size: 12px; margin-top: 3px; color: var(--ink-3); }
  .up { color: var(--pos); }
  .down { color: var(--neg); }
  .neg-num { color: var(--neg); }
  .pos-num { color: var(--pos); }

  /* grid + card */
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
  .card {
    background: var(--surface-1); border-radius: 12px; box-shadow: var(--shadow);
    padding: 18px 18px 16px; min-width: 0; grid-column: span 12;
  }
  .card.s6 { grid-column: span 6; }
  .card.s4 { grid-column: span 4; }
  @media (max-width: 900px) { .card.s6, .card.s4 { grid-column: span 12; } }
  .card h2 { font-size: 14.5px; font-weight: 650; margin: 0; }
  .card .sub { color: var(--ink-2); font-size: 12px; margin: 3px 0 0; }
  .card-head { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .tog {
    margin-left: auto; flex: none; font: inherit; font-size: 12px; cursor: pointer;
    background: transparent; border: 1px solid var(--ring); color: var(--ink-2); border-radius: 8px; padding: 4px 10px;
  }
  .tog:hover { color: var(--ink); }

  svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
  svg.chart .gline { stroke: var(--grid); stroke-width: 1; }
  svg.chart .gaxis { stroke: var(--axis); stroke-width: 1; }
  svg.chart .gtick { fill: var(--ink-3); font-size: 10.5px; font-variant-numeric: tabular-nums; }
  svg.chart .glab { fill: var(--ink-2); font-size: 11px; }
  svg.chart .cross { stroke: var(--axis); stroke-width: 1; }
  svg.chart .hit { fill: transparent; cursor: crosshair; }
  svg.chart rect.bar { transition: opacity .12s ease; }
  svg.chart rect.bar:hover { opacity: .78; }

  /* legend */
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; }
  .legend .li { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
  .legend .lk { width: 16px; height: 3px; border-radius: 2px; flex: none; }
  .legend .lk.r { width: 11px; height: 11px; border-radius: 3px; }

  /* tables */
  /* 间距放在包裹层而非 table 上：隐藏表格时留白不会一起消失，卡片高度稳定 */
  .twrap { margin-top: 12px; max-height: 340px; overflow: auto; }
  table.dt { width: 100%; border-collapse: collapse; font-size: 12.8px; }
  /* sticky 表头让长表滚动时仍可见列名 */
  table.dt thead th { position: sticky; top: 0; background: var(--surface-1); }
  table.dt th, table.dt td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
  table.dt th:first-child, table.dt td:first-child { text-align: left; }
  table.dt th { color: var(--ink-3); font-weight: 500; font-size: 11.5px; }
  table.dt td { font-variant-numeric: tabular-nums; color: var(--ink); }
  table.dt tr:last-child td { border-bottom: none; }
  .tag {
    display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 5px;
    background: var(--mid); color: var(--ink-2); white-space: nowrap;
  }

  /* strategy detail */
  .thresh { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 12px; }
  .thresh th, .thresh td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
  .thresh th { color: var(--ink-3); font-weight: 500; font-size: 11.5px; width: 42%; }
  .thresh td { font-variant-numeric: tabular-nums; }
  .thresh tr:last-child th, .thresh tr:last-child td { border-bottom: none; }
  .acct { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  /* tooltip */
  #tip {
    position: fixed; pointer-events: none; z-index: 50;
    background: var(--surface-1); border: 1px solid var(--ring); border-radius: 9px;
    padding: 9px 11px; font-size: 12.5px; box-shadow: 0 4px 16px rgba(0,0,0,.13);
    min-width: 168px; display: none;
  }
  #tip .ttitle { color: var(--ink-3); font-size: 11.5px; margin-bottom: 5px; }
  #tip .trow { display: flex; align-items: center; gap: 7px; padding: 2px 0; }
  #tip .tval { font-weight: 650; font-variant-numeric: tabular-nums; }
  #tip .tname { color: var(--ink-2); margin-left: auto; padding-left: 8px; }
  #tip .lk { width: 13px; height: 3px; border-radius: 2px; flex: none; }

  footer { margin-top: 30px; color: var(--ink-3); font-size: 12px; line-height: 1.7; }
  footer code { background: var(--mid); padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }
</style>
</head>

<div class="wrap">
  <header class="top">
    <div>
      <h1>量化系统 V1 · 策略竞技场看板</h1>
      <p id="meta"></p>
    </div>
    <button class="theme-btn" id="themeBtn" type="button">切换深色</button>
  </header>

  <section class="hero">
    <div>
      <div class="hero-label">四账户合并收益率</div>
      <div class="hero-figure" id="hero"></div>
    </div>
    <div class="hero-sub" id="heroSub"></div>
  </section>

  <div class="filters" role="group" aria-label="筛选">
    <span class="flabel">账户</span>
    <div id="stratChips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    <span class="spacer"></span>
    <span class="flabel">数据视图</span>
    <button class="chip" id="viewToggle" type="button" aria-pressed="false">显示数据表</button>
  </div>

  <section class="kpis" id="kpis"></section>

  <div id="tables"></div>

  <div class="grid" id="cards"></div>

  <footer>
    <div id="footMeta"></div>
    <div>数据来源：<code>backtest/results/summary.json</code>、<code>trades.parquet</code>、<code>daily_nav.parquet</code>、
      <code>data/signals</code>、<code>config.yaml</code>。</div>
    <div>回测使用模拟生成的日线数据，仅用于验证流程，收益数字不代表真实策略表现。</div>
  </footer>
</div>

<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const SVGNS = "http://www.w3.org/2000/svg";
const STRAT_ORDER = D.strategies.map(s => s.name);
const COLORS = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)"];
const NAMES = {pullback:"缩量回踩", breakout:"平台突破", oversold:"超跌反弹", momentum:"强者恒强"};
const active = new Set(STRAT_ORDER);   // 颜色跟随实体，不随筛选重排

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const fmt = (v, d=2) => v === null || v === undefined ? "—"
  : Number(v).toLocaleString("zh-CN", {minimumFractionDigits:d, maximumFractionDigits:d});
const fmtInt = v => v === null || v === undefined ? "—" : Number(v).toLocaleString("zh-CN");
const pct = (v, d=2) => v === null || v === undefined ? "—"
  : (v > 0 ? "+" : "") + Number(v).toFixed(d) + "%";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function svgEl(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function niceTicks(min, max, count) {
  const span = (max - min) || 1;
  const step0 = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const norm = step0 / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step;
  const hi = Math.ceil(max / step) * step;
  const out = [];
  for (let v = lo; v <= hi + step * 0.5; v += step) out.push(Math.round(v * 1e9) / 1e9);
  return out;
}
/* 文本一律 textContent / createTextNode，不拼 innerHTML */
function text(tag, attrs, str) {
  const e = svgEl(tag, attrs);
  e.textContent = str;
  return e;
}

/* ---------- tooltip ---------- */
const tip = $("tip");
function showTip(evt, rows, title) {
  tip.replaceChildren();
  if (title) { const t = document.createElement("div"); t.className = "ttitle"; t.textContent = title; tip.appendChild(t); }
  rows.forEach(r => {
    const row = document.createElement("div"); row.className = "trow";
    if (r.color) { const k = document.createElement("span"); k.className = "lk"; k.style.background = r.color; row.appendChild(k); }
    const v = document.createElement("span"); v.className = "tval"; v.textContent = r.value; row.appendChild(v);
    const n = document.createElement("span"); n.className = "tname"; n.textContent = r.name; row.appendChild(n);
    tip.appendChild(row);
  });
  tip.style.display = "block"; tip.setAttribute("aria-hidden", "false");
  const r = tip.getBoundingClientRect();
  let x = evt.clientX + 16, y = evt.clientY - r.height / 2;
  if (x + r.width > innerWidth - 8) x = evt.clientX - r.width - 16;
  if (x < 8) x = 8;
  if (y < 8) y = 8;
  if (y + r.height > innerHeight - 8) y = innerHeight - r.height - 8;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.style.display = "none"; tip.setAttribute("aria-hidden", "true"); }

/* ---------- KPI + hero ---------- */
function renderHero() {
  const cash = Number(D.backtest_window.initial_cash);
  let end = 0, start = 0;
  D.nav.forEach(r => {
    if (STRAT_ORDER.includes(r.strategy)) {
      if (r.date === D.nav_dates[0]) start += Number(r.total);
      if (r.date === D.nav_dates[D.nav_dates.length-1]) end += Number(r.total);
    }
  });
  const ret = start > 0 ? (end / start - 1) * 100 : null;
  const el = $("hero");
  el.textContent = ret === null ? "—" : (ret > 0 ? "+" : "") + ret.toFixed(2);
  const small = document.createElement("small");
  small.textContent = "%";
  el.appendChild(small);
  el.className = "hero-figure " + (ret === null ? "" : (ret >= 0 ? "pos-num" : "neg-num"));
  $("heroSub").innerHTML = "";
  const t = document.createElement("div");
  t.textContent = "合并账户期末资产 " + fmt(end, 0) + " 元 · 期初 " + fmt(start, 0) + " 元";
  const t2 = document.createElement("div");
  t2.textContent = "回测窗口 " + D.backtest_window.start + " → " + D.backtest_window.end;
  $("heroSub").appendChild(t); $("heroSub").appendChild(t2);
}

function renderKPIs() {
  const box = $("kpis"); box.replaceChildren();
  const n0 = D.backtest_window.initial_cash;
  const stats = D.strategies.map(s => ({
    ...s,
    pnl: (s.final_nav - 1) * n0
  }));
  const totalTrades = stats.reduce((a, s) => a + s.trades, 0);
  const avgWin = stats.reduce((a, s) => a + (s.win_rate || 0), 0) / stats.length;
  const nDays = D.nav_dates.length;

  const items = [
    {label:"信号总数", val: fmtInt(D.signal_total), delta: D.signals.length + " 个检测器覆盖", cls:""},
    {label:"卖出平仓", val: fmtInt(D.reason_total), delta: "四账户合计", cls:""},
    {label:"累计成交", val: fmtInt(totalTrades), delta: "买入 + 卖出", cls:""},
    {label:"平均胜率", val: fmt(avgWin, 1) + "%", delta: "按账户算术平均", cls:""},
    {label:"回测交易日", val: fmtInt(nDays), delta: D.nav_dates[0] + " 起", cls:""},
  ];
  items.forEach(it => {
    const d = document.createElement("div"); d.className = "tile";
    const a = document.createElement("div"); a.className = "tlabel"; a.textContent = it.label;
    const b = document.createElement("div"); b.className = "tval"; b.textContent = it.val;
    const c = document.createElement("div"); c.className = "tdelta"; c.textContent = it.delta;
    d.appendChild(a); d.appendChild(b); d.appendChild(c);
    box.appendChild(d);
  });
}

/* ---------- 过滤条 ---------- */
function renderFilters() {
  const box = $("stratChips"); box.replaceChildren();
  STRAT_ORDER.forEach(n => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip";
    b.setAttribute("aria-pressed", String(active.has(n)));
    const s = document.createElement("span"); s.className = "sw";
    s.style.background = COLORS[STRAT_ORDER.indexOf(n)];
    const l = document.createElement("span"); l.textContent = NAMES[n];
    b.appendChild(s); b.appendChild(l);
    b.addEventListener("click", () => {
      if (active.has(n)) active.delete(n); else active.add(n);
      renderFilters(); renderAll();
    });
    box.appendChild(b);
  });
}

/* ---------- 图1 收益率条形 ---------- */
function barChart(rows, {w=760, h=280, padT=18, padB=34, padL=46, padR=16, unit="", tipFn}) {
  const svg = svgEl("svg", {class:"chart", viewBox:`0 0 ${w} ${h}`, role:"img"});
  const vals = rows.map(r => r.value).filter(v => v !== null && v !== undefined);
  if (!vals.length) return svg;
  const ticks = niceTicks(Math.min(...vals, 0), Math.max(...vals, 0), 5);
  const x0 = ticks[0], x1 = ticks[ticks.length-1];
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const sx = v => padL + ((v - x0) / (x1 - x0 || 1)) * plotW;
  const zero = sx(0);

  ticks.forEach(t => {
    svg.appendChild(text("line", {class:"gline", x1:sx(t), y1:padT, x2:sx(t), y2:padT+plotH}));
    svg.appendChild(text("text", {class:"gtick", x:sx(t), y:padT+plotH+16, "text-anchor":"middle"}, String(Math.round(t))));
  });
  svg.appendChild(text("line", {class:"gaxis", x1:zero, y1:padT, x2:zero, y2:padT+plotH}));

  const gap = 2;
  const bw = Math.min(26, (plotH / rows.length) - gap);
  rows.forEach((r, i) => {
    const y = padT + i * (plotH / rows.length) + gap / 2;
    const px = sx(r.value);
    const x = Math.min(zero, px), bwpx = Math.max(2, Math.abs(px - zero));
    const rect = svgEl("rect", {
      class:"bar", x, y, width:bwpx, height:bw, rx:4, ry:4, fill:r.color
    });
    rect.appendChild(svgEl("title")).textContent = r.name + " " + r.value + unit;
    rect.addEventListener("mousemove", e => showTip(e, [
      {color:r.color, value:r.value + unit, name:r.name}
    ], tipFn ? tipFn(r) : null));
    rect.addEventListener("mouseleave", hideTip);
    rect.addEventListener("focus", e => {
      const b = rect.getBoundingClientRect();
      showTip({clientX:b.left + b.width/2, clientY:b.top}, [
        {color:r.color, value:r.value + unit, name:r.name}
      ], tipFn ? tipFn(r) : null);
    });
    rect.addEventListener("blur", hideTip);
    rect.setAttribute("tabindex", "0");
    svg.appendChild(rect);
    svg.appendChild(text("text", {class:"glab", x:padL - 10, y:y + bw/2 + 4, "text-anchor":"end"}, r.name));
    /* 端点直接标注：relief rule（浅底色 slot 低于 3:1）需要可见标签 */
    svg.appendChild(text("text", {
      class:"glab", x:Math.max(padL + bwpx + 8, px + 8), y:y + bw/2 + 4, "text-anchor":"start",
      fill:"var(--ink)"
    }, r.value + unit));
  });
  return svg;
}

/* ---------- 图2 净值折线 ---------- */
function lineChart(series, {w=760, h=320, padT=16, padB=34, padL=52, padR=16, unit=""}) {
  const svg = svgEl("svg", {class:"chart", viewBox:`0 0 ${w} ${h}`, role:"img"});

  const x0 = xs[0], x1 = xs[xs.length-1];
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const sx = i => padL + (i / (xs.length - 1 || 1)) * plotW;
  const sy = v => padT + plotH - ((v - ticks[0]) / (ticks[ticks.length-1] - ticks[0] || 1)) * plotH;

  ticks.forEach(t => {
    svg.appendChild(text("line", {class:"gline", x1:padL, y1:sy(t), x2:padL+plotW, y2:sy(t)}));
    svg.appendChild(text("text", {class:"gtick", x:padL-9, y:sy(t)+4, "text-anchor":"end"},
      Number(t).toFixed(2)));
  });
  svg.appendChild(text("line", {class:"gaxis", x1:padL, y1:padT+plotH, x2:padL+plotW, y2:padT+plotH}));
  svg.appendChild(text("text", {class:"gtick", x:padL, y:padT+plotH+16}, x0));
  svg.appendChild(text("text", {class:"gtick", x:padL+plotW, y:padT+plotH+16, "text-anchor":"end"}, x1));

  series.forEach(s => {
    let d = "";
    s.points.forEach((p, i) => { d += (i ? "L" : "M") + sx(i).toFixed(1) + " " + sy(p.y).toFixed(1); });
    svg.appendChild(svgEl("path", {
      d, fill:"none", stroke:s.color, "stroke-width":2, "stroke-linejoin":"round", "stroke-linecap":"round"
    }));
  });

  /* crosshair：命中整列，一个 tooltip 列出全部序列 */
  const cross = svgEl("line", {class:"cross", y1:padT, y2:padT+plotH, opacity:0});
  svg.appendChild(cross);
  const hit = svgEl("rect", {class:"hit", x:padL, y:padT, width:plotW, height:plotH});
  hit.addEventListener("mousemove", e => {
    const r = svg.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width * w;
    const i = Math.max(0, Math.min(xs.length-1, Math.round(((px - padL) / plotW) * (xs.length-1))));
    cross.setAttribute("x1", sx(i)); cross.setAttribute("x2", sx(i)); cross.setAttribute("opacity", 1);
    const rows = series.filter(s => active.has(s.name)).map(s => ({
      color:s.color, value:s.points[i].y.toFixed(4), name:NAMES[s.name]
    }));
    showTip(e, rows, "净值 @ " + xs[i]);
  });
  hit.addEventListener("mouseleave", () => { cross.setAttribute("opacity", 0); hideTip(); });
  svg.appendChild(hit);
  return svg;
}

/* ---------- 图3 卖出规则条形（发散：以 0 为基线） ---------- */
function divergingBar(rows, {w=760, h=270}) {
  return barChart(rows.map(r => ({...r, value:r.count})), {w, h, unit:" 笔"});
}

/* ---------- 图4 信号分布 ---------- */
function signalChart() {
  const rows = D.signals.map(s => ({
    name:s.cn, color:COLORS[s.slot], value:s.count,
    raw:s.name + "（" + s.cn + "）"
  }));
  return barChart(rows, {w:620, h:210, unit:" 条", tipFn:r => "检测器 " + r.raw});
}

/* ---------- 图5 候选池漏斗 ---------- */
function funnelChart() {
  const u = D.universe;
  const rows = [
    {name:"全市场快照", color:"var(--s1)", value:u.distinct_codes || u.raw_rows || 0, raw:"快照去重股票数"},
    {name:"股价区间", color:"var(--s1)", value:u.pass_price || 0, raw:"3~200 元"},
    {name:"流通市值", color:"var(--s1)", value:u.pass_cap || 0, raw:"30~1500 亿"},
    {name:"涨跌幅限制", color:"var(--s1)", value:u.pass_pct || 0, raw:"±7%"},
    {name:"候选池上限", color:"var(--s1)", value:u.candidate_pool || 0, raw:"config 配置值"},
  ];
  return barChart(rows, {w:620, h:230, unit:" 只", tipFn:r => r.raw});
}

/* ---------- 图6 情绪闸门 meter ---------- */
function gateChart() {
  const g = D.gate;
  const bands = D.gate_bands;
  const w = 760, h = 210, padL = 52, padR = 52, barY = 78, barH = 26;
  const svg = svgEl("svg", {class:"chart", viewBox:`0 0 ${w} ${h}`, role:"img"});
  const x0 = 0, x1 = 100;
  const sx = v => padL + ((v - x0) / (x1 - x0)) * (w - padL - padR);

  bands.forEach(b => {
    const x1p = sx(b.high), x0p = sx(b.low);
    let fill;
    if (b.mode === "open") fill = "var(--open-c)";
    else if (b.mode === "limited") fill = "var(--limit-c)";
    else fill = "var(--halt-c)";
    svg.appendChild(svgEl("rect", {x:x0p, y:barY, width:Math.max(2,x1p-x0p-2), height:barH, rx:4, fill}));
    svg.appendChild(text("text", {class:"glab", x:(x0p+x1p)/2, y:barY+barH+20, "text-anchor":"middle"},
      b.band + " · 每轮最多 " + b.max_buy + " 只"));
    const hit = svgEl("rect", {x:x0p, y:barY, width:Math.max(4,x1p-x0p), height:barH, fill:"transparent", tabindex:"0"});
    hit.addEventListener("mousemove", e => showTip(e, [
      {color:fill, value:b.band, name:b.max_buy + " 只/轮"},
      {value:"区间 " + b.low + "~" + b.high, name:""}
    ], "闸门档位"));
    hit.addEventListener("mouseleave", hideTip);
    svg.appendChild(hit);
  });

  /* 三项分项指标取最新一日：标签与字段名一一对应，不用索引猜 */
  const latest = D.sentiment[D.sentiment.length - 1];
  const METRICS = [
    ["profit_effect",    "赚钱效应"],
    ["market_temp",       "市场温度"],
    ["retail_sentiment",  "散户情绪"],
  ];
  METRICS.forEach(([key, lab], i) => {
    const y = 168 + i * 14;
    const val = Number(latest[key]);
    svg.appendChild(text("text", {class:"glab", x:padL-9, y:y, "text-anchor":"end"}, lab));
    svg.appendChild(svgEl("rect", {x:padL, y:y-7, width:w-padL-padR, height:9, rx:4, fill:"var(--mid)"}));
    svg.appendChild(svgEl("rect", {
      x:padL, y:y-7, width:Math.max(2,(w-padL-padR)*(val/100)),
      height:9, rx:4, fill:"var(--s1)"
    }));
    svg.appendChild(text("text", {class:"glab", x:w-padR+9, y:y, "text-anchor":"start"},
      val.toFixed(1)));
  });

  /* 综合分落点：竖线标记 */
  D.sentiment.forEach(r => {
    const sxv = sx(r.sentiment_score);
    svg.appendChild(svgEl("line", {x1:sxv, y1:barY-10, x2:sxv, y2:barY+barH+10,
      stroke:"var(--ink)", "stroke-width":1.5}));
  });
  svg.appendChild(text("text", {class:"gtick", x:padL, y:barY-18}, "0"));
  svg.appendChild(text("text", {class:"gtick", x:padL+(w-padL-padR), y:barY-18, "text-anchor":"end"}, "100"));
  return svg;
}

/* ---------- 卡片外壳 ---------- */
function card(id, title, sub) {
  const c = document.createElement("section");
  c.className = "card"; c.id = id;
  const head = document.createElement("div"); head.className = "card-head";
  const h = document.createElement("h2"); h.textContent = title;
  const s = document.createElement("p"); s.className = "sub"; s.textContent = sub;
  head.appendChild(h); head.appendChild(s);
  c.appendChild(head);
  return c;
}

function legendBar(items, rect) {
  const l = document.createElement("div"); l.className = "legend";
  items.forEach(it => {
    const li = document.createElement("span"); li.className = "li";
    const k = document.createElement("span");
    k.className = "lk" + (rect ? " r" : "");
    k.style.background = it.color;
    const t = document.createElement("span"); t.textContent = it.name;
    li.appendChild(k); li.appendChild(t); l.appendChild(li);
  });
  return l;
}

function dtWrap(id, headers, rows) {
  const box = document.createElement("div"); box.className = "twrap"; box.id = id;
  const t = document.createElement("table"); t.className = "dt";
  const thead = document.createElement("thead");
  const hr = document.createElement("tr");
  headers.forEach(h => { const th = document.createElement("th"); th.textContent = h; hr.appendChild(th); });
  thead.appendChild(hr); t.appendChild(thead);
  const tb = document.createElement("tbody");
  rows.forEach(r => {
    const tr = document.createElement("tr");
    r.forEach(cell => {
      const td = document.createElement("td");
      if (cell && cell.__tag) {
        const sp = document.createElement("span"); sp.className = "tag"; sp.textContent = cell.__tag;
        td.appendChild(sp);
      } else td.textContent = cell === null || cell === undefined ? "—" : String(cell);
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  t.appendChild(tb); box.appendChild(t); return box;
}

/* ---------- 全部渲染 ---------- */
let showTables = false;

function renderAll() {
  const grid = $("cards"); grid.replaceChildren();
  const shown = STRAT_ORDER.filter(n => active.has(n));

  /* 1. 收益率 */
  const c1 = card("c-ret", "各策略期末收益率", "控制变量法：仅选股信号不同，风控/闸门/仓位完全一致");
  const rows = shown.map(n => {
    const s = D.strategies.find(x => x.name === n);
    return {name:s.cn, color:COLORS[s.slot], value:s.return_pct, raw:s.account + " · " + s.cn};
  });
  c1.appendChild(barChart(rows, {w:760, h:250, unit:"%",
    tipFn:r => r.raw + " · 期末净值 " + fmt((1 + (r.value||0)/100), 4)}));
  c1.appendChild(legendBar(shown.map(n => ({name:NAMES[n] + " " + D.strategies.find(x=>x.name===n).account,
    color:COLORS[STRAT_ORDER.indexOf(n)]})), false));
  c1.appendChild(dtWrap("t-ret",
    ["账户","策略","期末净值","收益率","买入","卖出","胜率"],
    shown.map(n => {
      const s = D.strategies.find(x => x.name === n);
      return [s.account, s.cn, fmt(s.final_nav, 4), pct(s.return_pct), fmtInt(s.buys), fmtInt(s.sells), fmt(s.win_rate,1)+"%"];
    })));
  grid.appendChild(c1);

  /* 2. 净值曲线 */
  const c2 = card("c-nav", "净值曲线", "悬停查看任一交易日四账户净值");
  const series = shown.map(n => {
    const pts = D.nav.filter(r => r.strategy === n)
      .sort((a,b) => a.date < b.date ? -1 : 1)
      .map(r => ({date:r.date, y:Number(r.nav)}));
    return {name:n, color:COLORS[STRAT_ORDER.indexOf(n)], points:pts};
  });
  c2.appendChild(lineChart(series, {w:1210, h:330}));
  c2.appendChild(legendBar(shown.map(n => ({name:NAMES[n] + " " + D.strategies.find(x=>x.name===n).account,
    color:COLORS[STRAT_ORDER.indexOf(n)]})), false));
  grid.appendChild(c2);

  /* 3. 卖出规则 + 4. 信号分布 */
  const c3 = card("c-rule", "卖出风控触发分布", "R1~R5 主规则 + B1~B3 兜底，按优先级排序");
  c3.appendChild(divergingBar(D.reasons.map(r => ({
    name:r.rule, color: r.count ? "var(--s2)" : "var(--mid)", count:r.count
  })), {w:680, h:230}));
  c3.appendChild(dtWrap("t-rule", ["规则","触发次数","占卖出比"],
    D.reasons.map(r => [r.rule, fmtInt(r.count),
      D.reason_total ? fmt(r.count/D.reason_total*100,1)+"%" : "—"])));
  grid.appendChild(c3);

  const c4 = card("c-sig", "选股信号产出", "四检测器在回测窗口内命中的信号条数");
  c4.appendChild(signalChart());
  c4.appendChild(dtWrap("t-sig", ["检测器","信号条数","占比"],
    D.signals.map(s => [s.cn, fmtInt(s.count),
      D.signal_total ? fmt(s.count/D.signal_total*100,1)+"%" : "—"])));
  grid.appendChild(c4);

  /* 5. 候选池漏斗 + 6. 情绪闸门 */
  const c5 = card("c-fun", "候选池漏斗", "从全市场快照到 600 只候选的各层过滤");
  c5.appendChild(funnelChart());
  grid.appendChild(c5);

  const c6 = card("c-gate", "情绪闸门", "综合分 = 0.45·赚钱效应 + 0.35·市场温度 + 0.20·散户情绪");
  c6.appendChild(gateChart());
  grid.appendChild(c6);

  /* 7. 子模块阈值（每策略一张） */
  const c7 = card("c-thr", "子模块阈值配置", "数值直接读自 config.yaml，改动配置后重新生成看板即可");
  const detKeys = ["pullback","breakout","oversold","momentum"];
  const wrap = document.createElement("div");
  wrap.style.cssText = "display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:14px";
  detKeys.forEach(k => {
    const det = D.detectors[k];
    const s = D.strategies.find(x => x.name === k);
    const box = document.createElement("div");
    box.style.cssText = "border:1px solid var(--grid);border-radius:10px;padding:13px 14px";
    const hh = document.createElement("div");
    hh.style.cssText = "font-weight:650;font-size:13px;display:flex;align-items:center;gap:7px";
    const sw = document.createElement("span"); sw.style.cssText = "width:10px;height:10px;border-radius:3px;flex:none";
    sw.style.background = COLORS[SLOT(k)];
    hh.appendChild(sw);
    hh.appendChild(document.createTextNode(det.cn + " · " + s.account));
    const lg = document.createElement("div");
    lg.style.cssText = "color:var(--ink-2);font-size:11.5px;margin:3px 0 8px";
    lg.textContent = s.logic;
    box.appendChild(hh); box.appendChild(lg);
    const t = document.createElement("table"); t.className = "thresh";
    det.thresholds.forEach(th => {
      const tr = document.createElement("tr");
      const a = document.createElement("th"); a.textContent = th[0];
      const b = document.createElement("td"); b.textContent = th[1];
      tr.appendChild(a); tr.appendChild(b); t.appendChild(tr);
    });
    box.appendChild(t);
    wrap.appendChild(box);
  });
  c7.appendChild(wrap);
  grid.appendChild(c7);

  /* 8. 成交明细 */
  const c8 = card("c-tr", "成交明细", "四账户全部买入/卖出记录");
  const trs = [];
  D.strategies.forEach(s => s.sell_rows.forEach(r => trs.push({...r, strategy:s.name, account:s.account, slot:s.slot})));
  c8.appendChild(dtWrap("t-all", ["账户","策略","日期","代码","方向","价格","数量","得分","盈亏%","持有天数","卖出原因"],
    trs.map(r => [r.account, NAMES[r.strategy], r.date, r.code,
      r.side === "buy" ? {__tag:"买入"} : {__tag:"卖出"},
      fmt(r.price, 3), fmtInt(r.qty),
      r.score === null || r.score === undefined ? "—" : fmt(r.score, 2),
      r.gain_pct === null || r.gain_pct === undefined ? "—" : fmt(r.gain_pct, 2),
      r.hold_days === null || r.hold_days === undefined ? "—" : fmt(r.hold_days, 0),
      r.reason || "—"])));
  if (!trs.length) {
    const p = document.createElement("p"); p.className = "sub"; p.textContent = "回测窗口内无卖出记录";
    c8.appendChild(p);
  }
  grid.appendChild(c8);

  applyTableToggle();
}

/* SLOT lookup helper */
function SLOT(name) {
  return STRAT_ORDER.indexOf(name);
}

function applyTableToggle() {
  document.querySelectorAll(".twrap").forEach(w => {
    w.style.display = showTables ? "block" : "none";
  });
}

/* ---------- init ---------- */
function init() {
  $("meta").textContent =
    "回测窗口 " + D.backtest_window.start + " → " + D.backtest_window.end +
    " · 每账户初始资金 " + fmt(D.backtest_window.initial_cash, 0) + " 元 · 数据为模拟生成";
  $("footMeta").textContent = "看板由 web/build_dashboard.py 从回测结果生成，重新跑回测后需重新生成。";

  renderHero();
  renderKPIs();
  renderFilters();
  renderAll();

  $("viewToggle").addEventListener("click", e => {
    showTables = !showTables;
    e.currentTarget.setAttribute("aria-pressed", String(showTables));
    e.currentTarget.textContent = showTables ? "隐藏数据表" : "显示数据表";
    applyTableToggle();
  });

  const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
  const saved = localStorage.getItem("qt-theme");
  if (saved === "dark") document.documentElement.setAttribute("data-theme", "dark");
  if (saved === "light") document.documentElement.setAttribute("data-theme", "light");
  $("themeBtn").textContent = saved === "dark" || (!saved && prefersDark) ? "切换浅色" : "切换深色";
  $("themeBtn").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("qt-theme", next);
    $("themeBtn").textContent = next === "dark" ? "切换浅色" : "切换深色";
  });

  addEventListener("scroll", hideTip, {passive:true});
}
init();
</script>
